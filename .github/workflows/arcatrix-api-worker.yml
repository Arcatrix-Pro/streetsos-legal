name: Arcatrix API Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arcatrix-api-worker.yml"
      - "scripts/arcatrix-api-worker.mjs"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: arcatrix-api-worker
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get Arcatrix Executor OIDC token
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) sep='&' ;; esac
          token_json="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL${sep}audience=arcatrix-executor")"
          token="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(j.value)' <<<"$token_json")"
          echo "ARCATRIX_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run one API action
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/arcatrix-api-worker.mjs
